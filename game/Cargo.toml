[package]
publish = false
name = "nfsu2"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "nfs_drive"

[dependencies]
# Gizmo motoru — SABİTLENMİŞ commit. Oyun donmuş bir motora karşı geliştirilir; kardeş
# `Gizmo` checkout'u bu sırada serbestçe ilerler (orada başka oturumlar çalışıyor) ve
# artık oyunun derlemesini etkilemez. Eskiden burada `path = "../../Gizmo/..."`
# vardı: o kurulumda motorun HEAD'i her ne ise oyun onu derliyordu.
#
# Pin: `main` @ ba969c0 (2026-08-11). Oyunun ihtiyaç duyduğu her şey bu commit'te:
# `Collider::trimesh`, `MaterialType::BakedLit`, önbelleklenmiş trimesh AABB,
# `VehicleTuning::torque_curve` (`shadow-gate` ve `trimesh-aabb` dalları main'e girmiş).
#
# Yerel motoru geçici olarak denemek için kök Cargo.toml'daki `[patch]` bloğunu aç.
# Pini yükseltmeden önce MOTOR-NOTLARI.md'deki kontrol listesini oku.
gizmo = { package = "gizmo-engine", git = "https://github.com/bdrtr/Gizmo", rev = "09c948a9848d481fc9a57b17ea7fd5bf519e4841", features = ["audio", "scripting", "scene", "editor", "render", "window", "ui"] }
# Saf NFSU2 asset parser'ı (motordan bağımsız) — artık kendi reposunda: PryHUB varlık aracı.
# Yerelde paralel geliştirme için kök Cargo.toml'daki `[patch]` bunu ../PryHUB'a yönlendirir.
gizmo-nfs = { git = "https://github.com/bdrtr/PryHUB.git", branch = "main" }
# Küçük async blok-on executor — yalnız headless screenshot binary (nfs_shot) için.
pollster = "0.3"

[[bin]]
name = "nfs_viewer"
path = "src/bin/nfs_viewer.rs"

[[bin]]
name = "nfs_drive"
path = "src/bin/nfs_drive.rs"

[[bin]]
name = "nfs_race"
path = "src/bin/nfs_race.rs"
